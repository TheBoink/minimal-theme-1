allow_embedding: false
db_schema:
  button_presses:
    client: none
    columns:
    - admin_ui: {}
      name: display
      target: displays
      type: link_single
    - admin_ui: {}
      name: button
      type: string
    - admin_ui: {}
      name: received_at
      type: datetime
    - admin_ui: {}
      name: event_id
      type: string
    - admin_ui: {}
      name: press_in_event
      type: number
    server: full
    title: Button Presses
  displays:
    client: none
    columns:
    - admin_ui: {}
      name: key_hash
      type: string
    - admin_ui: {}
      name: message
      type: string
    - admin_ui: {}
      name: revision
      type: number
    - admin_ui: {}
      name: displayed_revision
      type: number
    - admin_ui: {}
      name: last_seen
      type: datetime
    - admin_ui: {}
      name: button_count
      type: number
    - admin_ui: {}
      name: button_at
      type: datetime
    - admin_ui: {}
      name: button_event_id
      type: string
    server: full
    title: Displays
name: Minimal Theme 1
package_name: Minimal_Theme_1
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
startup: {module: Form1, type: form}

allow_embedding: false
db_schema:
  battery_readings:
    client: none
    columns:
    - admin_ui: {}
      name: display
      target: displays
      type: link_single
    - admin_ui: {}
      name: received_at
      type: datetime
    - admin_ui: {}
      name: event_id
      type: string
    - admin_ui: {}
      name: percentage
      type: number
    - admin_ui: {}
      name: status
      type: string
    server: full
    title: Battery Readings
  box_tilts:
    client: none
    columns:
    - {name: display, target: displays, type: link_single}
    - {name: event_id, type: string}
    - {name: tilted_at, type: datetime}
    - {name: received_at, type: datetime}
    server: full
    title: Box Tilts
  button_presses:
    client: none
    columns:
    - admin_ui: {order: 0, width: 118}
      client_hidden: false
      name: display
      target: displays
      type: link_single
    - admin_ui: {order: 1, width: 106}
      client_hidden: false
      name: button
      type: string
    - admin_ui: {order: 2, width: 152}
      client_hidden: false
      name: received_at
      type: datetime
    - admin_ui: {}
      name: event_id
      type: string
    - admin_ui: {order: 4, width: 98}
      client_hidden: false
      name: press_in_event
      type: number
    - admin_ui: {}
      name: drink_triggered
      type: bool
    - admin_ui: {}
      name: drink_reserved
      type: bool
    - admin_ui: {}
      name: pulse_gap_ms
      type: number
    indexes: []
    server: full
    title: Button Presses
  displays:
    client: none
    columns:
    - admin_ui: {}
      name: key_hash
      type: string
    - admin_ui: {}
      name: message
      type: string
    - admin_ui: {}
      name: revision
      type: number
    - admin_ui: {}
      name: displayed_revision
      type: number
    - admin_ui: {}
      name: last_seen
      type: datetime
    - admin_ui: {}
      name: button_count
      type: number
    - admin_ui: {}
      name: button_at
      type: datetime
    - admin_ui: {}
      name: button_event_id
      type: string
    - admin_ui: {}
      name: pulse_gap_ms
      type: number
    - admin_ui: {}
      name: cooldown_minutes
      type: number
    - admin_ui: {}
      name: waiting_message
      type: string
    - admin_ui: {}
      name: drink_schedule
      type: string
    - admin_ui: {}
      name: limit_message
      type: string
    - admin_ui: {}
      name: drink_progress_message
      type: string
    - admin_ui: {}
      name: drink_checking_message
      type: string
    - admin_ui: {}
      name: firmware
      type: media
    - admin_ui: {}
      name: firmware_signature
      type: string
    - admin_ui: {}
      name: firmware_hash
      type: string
    - admin_ui: {}
      name: firmware_published_at
      type: datetime
    - admin_ui: {}
      name: running_firmware_version
      type: string
    server: full
    title: Displays
  door_openings:
    client: none
    columns:
    - {name: display, target: displays, type: link_single}
    - {name: event_id, type: string}
    - {name: opened_at, type: datetime}
    - {name: received_at, type: datetime}
    server: full
    title: Door Openings
metadata: {logo_img: 'asset:DrinkBuddy_stag_glass_240x240_RGB565_preview.png', title: DrinkBuddy}
name: DrinkBuddy
package_name: DrinkBuddy
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- {source: /runtime/services/anvil/secrets.yml}
startup: {module: Form1, type: form}
